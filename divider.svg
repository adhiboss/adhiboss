<svg width="900" height="16" viewBox="0 0 900 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1717" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff1717"/>
      <stop offset="1" stop-color="#ff1717" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="line"><rect x="0" y="6" width="900" height="4"/></clipPath>
  </defs>
  <rect x="0" y="7" width="900" height="2" fill="#2a1013"/>
  <g clip-path="url(#line)">
    <rect y="6" width="260" height="4" fill="url(#pulse)">
      <animate attributeName="x" values="-260;900" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="446" y="4" width="8" height="8" fill="#ff1717" transform="rotate(45 450 8)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
