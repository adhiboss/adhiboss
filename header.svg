<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d16"/>
      <stop offset="1" stop-color="#1c0508"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff1717" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff1717" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff1717" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ff1717" stroke-opacity="0.09"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="160" y="170" height="40" width="0">
        <animate attributeName="width" values="0;590;590;0" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .title { font: 800 82px 'Fira Code','Courier New',monospace; letter-spacing: 6px; text-anchor: middle; }
      .sub { font: 500 20px 'Fira Code','Courier New',monospace; fill: #c9d1d9; letter-spacing: 1px; }
      .tag { font: 500 13px 'Fira Code','Courier New',monospace; fill: #ff3030; letter-spacing: 4px; text-anchor: middle; }
      .gA { animation: glitchA 4s infinite steps(1); }
      .gB { animation: glitchB 4s infinite steps(1); }
      .scan { animation: scan 4s linear infinite; }
      .glow { animation: pulse 2.5s ease-in-out infinite; }
      @keyframes glitchA {
        0%,88%,100% { transform: translate(0,0); }
        90% { transform: translate(-7px,2px); }
        93% { transform: translate(5px,-3px); }
        96% { transform: translate(-3px,1px); }
      }
      @keyframes glitchB {
        0%,88%,100% { transform: translate(0,0); }
        91% { transform: translate(6px,-2px); }
        94% { transform: translate(-5px,3px); }
        97% { transform: translate(3px,-1px); }
      }
      @keyframes scan { 0% { transform: translateY(-90px); } 100% { transform: translateY(300px); } }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#grid)"/>
  <rect class="scan" width="900" height="90" fill="url(#scan)"/>

  <g class="glow" fill="none" stroke="#ff1717" stroke-width="3">
    <path d="M20 50V20H50"/>
    <path d="M850 20H880V50"/>
    <path d="M20 210V240H50"/>
    <path d="M850 240H880V210"/>
  </g>

  <text x="450" y="48" class="tag">&gt;&gt; SYSTEM ONLINE &lt;&lt;</text>

  <text class="title gB" x="450" y="140" fill="#5a0a0a">ADHI GOWDA</text>
  <text class="title gA" x="450" y="140" fill="#ff1717">ADHI GOWDA</text>
  <text class="title" x="450" y="140" fill="#ffffff">ADHI GOWDA</text>

  <g clip-path="url(#reveal)">
    <text class="sub" x="165" y="197">CS STUDENT // DEVELOPER // LINUX // OPEN SOURCE</text>
  </g>
  <rect y="177" width="10" height="26" fill="#ff1717">
    <animate attributeName="x" values="165;755;755;165" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
